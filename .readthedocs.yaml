version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    pre_install:
      # CPU wheels keep the docs build small; the default PyPI wheel bundles CUDA.
      - pip install torch --index-url https://download.pytorch.org/whl/cpu

sphinx:
  configuration: docs/source/conf.py
  fail_on_warning: true

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - doc
