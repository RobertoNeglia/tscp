# Settings for examples/bootstrap_intervals.py; requires the forest extra.
horizon: 1
num_origins: 120
seed: 0
alpha: 0.1
members: 12
in_bag_fraction: 0.6
member_spread: 0.2
methods:
  enbpi: {method: enbpi, window_size: 40}
  spci:
    method: spci
    lags: 4
    window_size: 40
    n_estimators: 10
    max_depth: 2
    seed: 0
    n_jobs: 1
